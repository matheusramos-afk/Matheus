<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O Peso da Decisão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#060C1C; --bg2:#0A1228; --panel:#0E1A3A; --panel2:#132245;
  --line:#1E2E59; --line2:#2A3C6E;
  --amber:#FFC831; --amber-dim:#8A6A1A; --amber-glow:rgba(255,200,49,.14);
  --ice:#C8D4EE; --muted:#8392B8; --muted2:#5E6E96;
  --blue:#227DBF; --green:#3FA85A; --red:#C65B4E;
  --sans:'Raleway',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ice);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 520px at 78% -8%, rgba(34,125,191,.13), transparent 62%),
    radial-gradient(700px 440px at 4% 102%, rgba(255,200,49,.07), transparent 60%);
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em;color:#fff;line-height:1.2}
p{margin:0 0 .85em}
p:last-child{margin-bottom:0}
a{color:var(--amber)}
button{font-family:inherit}

.wrap{max-width:1040px;margin:0 auto;padding:0 18px 72px}
.screen{display:none;animation:rise .45s cubic-bezier(.2,.8,.3,1)}
.screen.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:rgba(6,12,28,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);}
.top-in{max-width:1040px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:11px;letter-spacing:.22em;font-weight:800;color:#fff;white-space:nowrap}
.brand em{color:var(--amber);font-style:normal}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.hot{border-color:var(--amber-dim);color:var(--amber);background:var(--amber-glow)}
.pill.live{border-color:#2F5A3C;color:#6FD089;background:rgba(63,168,90,.1)}
.pill.local{border-color:#5A4A2F;color:#E0B45E;background:rgba(255,200,49,.08)}

/* ---------- progresso ---------- */
.steps{display:flex;gap:6px;max-width:1040px;margin:0 auto;padding:10px 18px 0}
.step{flex:1;height:3px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.step.done{background:var(--amber-dim)}
.step.now{background:var(--amber);box-shadow:0 0 14px rgba(255,200,49,.45)}
.steps-lbl{max-width:1040px;margin:0 auto;padding:7px 18px 0;display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted2);text-transform:uppercase}

/* ---------- tipografia ---------- */
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin-bottom:12px}
.kicker.cool{color:var(--blue)}
.lead{color:var(--muted);font-size:15px}
.sec-title{font-size:clamp(23px,4.4vw,34px);margin-bottom:10px}
.hr{height:1px;background:var(--line);margin:26px 0;border:0}

/* ---------- cartões ---------- */
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
  border-radius:14px;padding:20px}
.card.quiet{background:var(--bg2)}
.card.amber{border-color:var(--amber-dim);background:linear-gradient(180deg,#191430,#0D1024)}
.grid{display:grid;gap:12px}
@media(min-width:720px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

/* ---------- formulário ---------- */
label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);margin:0 0 7px}
input[type=text],textarea,select{
  width:100%;background:#091129;border:1px solid var(--line2);border-radius:10px;
  color:#fff;font-family:var(--sans);font-size:15.5px;padding:12px 14px;outline:none;
  transition:border-color .18s, box-shadow .18s}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-glow)}
textarea{resize:vertical;min-height:132px;line-height:1.6}
.hint{font-size:12.5px;color:var(--muted2);margin-top:7px}
.counter{font-family:var(--mono);font-size:11px;color:var(--muted2);text-align:right;margin-top:6px}
.counter.ok{color:var(--green)}

.codes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.code{background:#091129;border:1px solid var(--line2);border-radius:12px;padding:16px 8px;
  text-align:center;cursor:pointer;transition:.18s;user-select:none}
.code:hover{border-color:var(--line2);background:#0C1733}
.code .l{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--ice);line-height:1}
.code .s{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted2);margin-top:7px;text-transform:uppercase}
.code[aria-pressed=true]{border-color:var(--amber);background:var(--amber-glow)}
.code[aria-pressed=true] .l{color:var(--amber)}
.code[aria-pressed=true] .s{color:var(--amber)}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:var(--amber);color:#0A0F1F;border:0;border-radius:11px;
  padding:14px 24px;font-weight:800;font-size:14.5px;letter-spacing:.03em;cursor:pointer;
  transition:transform .14s, filter .18s;width:100%}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.38;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ice);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--amber);color:var(--amber)}
.btn.sm{padding:9px 14px;font-size:12.5px;width:auto;border-radius:9px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn-row .btn{width:auto;flex:1;min-width:160px}
.linkish{background:none;border:0;color:var(--muted2);font-size:12px;text-decoration:underline;
  cursor:pointer;padding:6px;font-family:var(--mono);letter-spacing:.08em}

/* ---------- perfil da empresa ---------- */
.dossie-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.sigla{width:72px;height:72px;flex:0 0 72px;border-radius:16px;border:1.5px solid var(--amber);
  background:var(--amber-glow);display:grid;place-items:center;
  font-family:var(--mono);font-size:33px;font-weight:600;color:var(--amber)}
.kv{display:grid;gap:0}
.kv .row{display:grid;grid-template-columns:1fr;gap:2px;padding:11px 0;border-top:1px solid var(--line)}
.kv .row:first-child{border-top:0}
@media(min-width:620px){.kv .row{grid-template-columns:168px 1fr;gap:14px;align-items:baseline}}
.kv dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.kv dd{margin:0;color:var(--ice);font-size:15px}
.stat{background:#091129;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:600;color:#fff;line-height:1.15}
.stat .v.amber{color:var(--amber)}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted2);margin-top:6px}
ul.bul{margin:0;padding-left:18px;color:var(--ice);font-size:14.5px}
ul.bul li{margin-bottom:7px}
ul.bul li::marker{color:var(--amber)}
ul.bul.cool li::marker{color:var(--blue)}

/* ---------- caminhos ---------- */
.path{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
  border-radius:14px;padding:18px;cursor:pointer;transition:.2s;position:relative}
.path:hover{border-color:var(--line2);transform:translateY(-2px)}
.path[aria-pressed=true]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 14px 34px -18px rgba(255,200,49,.5)}
.path .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--amber);margin-bottom:9px}
.path h4{font-size:17px;margin-bottom:9px}
.path .res{font-size:14px;color:var(--muted);margin-bottom:14px}
.vr{display:grid;gap:9px}
.vr div{font-size:12.8px;color:var(--ice);display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.vr b{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;flex:0 0 auto;padding:2px 6px;border-radius:5px;
  text-transform:uppercase;font-weight:600}
.vr .up b{background:rgba(63,168,90,.14);color:#6FD089}
.vr .dn b{background:rgba(198,91,78,.14);color:#E08878}
.check{position:absolute;top:14px;right:14px;width:21px;height:21px;border-radius:50%;
  border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;color:transparent}
.path[aria-pressed=true] .check{border-color:var(--amber);background:var(--amber);color:#0A0F1F}

/* ---------- revelação ---------- */
.reveal-art{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line);background:#070E20}
.reveal-name{font-size:clamp(27px,5.6vw,46px);color:var(--amber);letter-spacing:-.015em;line-height:1.08}
.block-t{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin-bottom:9px}
.srcs{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.srcs a{font-size:12.6px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line2);
  padding-bottom:6px;word-break:break-word;display:block}
.srcs a:hover{color:var(--amber);border-color:var(--amber-dim)}
.srcs a span{font-family:var(--mono);font-size:10px;color:var(--muted2);display:block;margin-top:2px}

/* ---------- linha do tempo ---------- */
.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;
  background:linear-gradient(180deg,var(--amber),var(--line2))}
.tl-item{position:relative;margin-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-28px;top:20px;width:14px;height:14px;border-radius:50%;
  background:var(--bg);border:2.5px solid var(--amber)}
.vs{display:grid;gap:10px;margin-top:12px}
@media(min-width:680px){.vs{grid-template-columns:1fr 1fr}}
.vs .b{border-radius:11px;padding:13px 15px;border:1px solid var(--line)}
.vs .b.mine{background:var(--amber-glow);border-color:var(--amber-dim)}
.vs .b.real{background:rgba(34,125,191,.09);border-color:#1E4C73}
.vs .b .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.vs .b.mine .t{color:var(--amber)}
.vs .b.real .t{color:#6BB6E8}
.vs .b .n{font-weight:700;color:#fff;font-size:14.5px;line-height:1.35}
.vs .b .d{font-size:13px;color:var(--muted);margin-top:6px;white-space:pre-wrap}
.final-quote{font-size:clamp(17px,3.3vw,25px);font-weight:800;color:var(--amber);line-height:1.38;letter-spacing:-.01em}

/* ---------- listas / admin ---------- */
.rowitem{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rowitem:first-child{border-top:0}
.badge{font-family:var(--mono);font-size:12px;font-weight:600;width:28px;height:28px;flex:0 0 28px;
  border-radius:8px;display:grid;place-items:center;background:var(--amber-glow);
  color:var(--amber);border:1px solid var(--amber-dim)}
.rowitem .nm{font-weight:600;color:#fff;font-size:14.5px}
.rowitem .sub{font-size:12px;color:var(--muted2);font-family:var(--mono)}
.dots{margin-left:auto;display:flex;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.dot.on{background:var(--amber)}
.empty{text-align:center;color:var(--muted2);font-size:13.5px;padding:24px 10px;font-family:var(--mono)}
.sticky-note{position:sticky;bottom:12px;margin-top:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:#13203F;border:1px solid var(--line2);color:#fff;padding:12px 18px;border-radius:11px;
  font-size:13.5px;z-index:120;box-shadow:0 18px 40px -18px #000;max-width:calc(100% - 36px);text-align:center}
.wait{display:flex;align-items:center;gap:11px;color:var(--muted);font-size:14px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--amber);animation:pl 1.7s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
.scrollx{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted2);font-weight:500}
td .mini{color:var(--muted);font-size:12px;white-space:pre-wrap;max-width:380px}
.pre{white-space:pre-wrap;font-size:13.5px;color:var(--ice)}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.hero-title{font-size:clamp(38px,10.5vw,86px);line-height:.95;letter-spacing:-.025em;font-weight:900}
.hero-title .y{color:var(--amber);display:block}
</style>
<style>
/* ---------- revelação em destaque ---------- */
.case{border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel),var(--bg2));margin-bottom:20px}
.case.mine{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 22px 50px -26px rgba(255,200,49,.5)}
.case-media{position:relative;width:100%;aspect-ratio:16/7;background:#070E20;overflow:hidden}
.case-media>svg,.case-media>img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.case-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,12,28,.12) 0%,rgba(6,12,28,.55) 55%,rgba(6,12,28,.96) 100%)}
.case-over{position:absolute;inset:auto 0 0 0;padding:16px 20px 18px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.case-logo{width:54px;height:54px;flex:0 0 54px;border-radius:13px;background:rgba(255,255,255,.95);
  display:grid;place-items:center;overflow:hidden;font-family:var(--mono);font-weight:600;font-size:19px;color:#0A0F1F}
.case-logo img{width:100%;height:100%;object-fit:contain;padding:6px;background:#fff}
.case-name{font-size:clamp(22px,4.6vw,38px);font-weight:900;letter-spacing:-.02em;color:#fff;line-height:1.05}
.case-year{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--amber);margin-bottom:4px}
.case-body{padding:18px 20px 20px}
.case-t{font-size:clamp(16px,2.8vw,21px);color:var(--amber);font-weight:800;line-height:1.3;margin-bottom:12px}
.case-grid{display:grid;gap:12px}
@media(min-width:760px){.case-grid{grid-template-columns:1fr 1fr}}
.case-box{background:#091129;border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.case-box .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
.case-box p{font-size:13.6px;color:var(--ice);margin:0}
.case-box.key{background:var(--amber-glow);border-color:var(--amber-dim)}
.case-box.key p{color:#FFE6A8}
.case-path{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:#6BB6E8;border:1px solid #1E4C73;
  background:rgba(34,125,191,.1);padding:5px 10px;border-radius:8px;margin-bottom:12px}
.mine-tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  background:var(--amber);color:#0A0F1F;padding:4px 9px;border-radius:7px;font-weight:600;margin-bottom:10px}
.dilema-box{background:linear-gradient(180deg,#141028,#0B1024);border:1px solid var(--amber-dim);
  border-radius:16px;padding:22px}
.dilema-q{font-size:clamp(19px,3.6vw,27px);font-weight:800;color:#fff;line-height:1.3;letter-spacing:-.01em}
.real-strip{display:grid;gap:10px;margin-top:12px}
@media(min-width:680px){.real-strip{grid-template-columns:1fr 1fr}}
.upl{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.upl:first-of-type{border-top:0}
.upl .lbl{font-family:var(--mono);font-size:11px;color:var(--ice);min-width:132px}
.upl .st{font-family:var(--mono);font-size:10.5px;color:var(--muted2);margin-left:auto}
.upl .st.ok{color:#6FD089}
.thumb{width:46px;height:30px;border-radius:6px;object-fit:cover;border:1px solid var(--line2);background:#070E20}
input[type=file]{font-size:12px;color:var(--muted);max-width:190px}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand">O PESO DA <em>DECISÃO</em></div>
  <div class="top-meta" id="topMeta"></div>
</div></div>
<div id="steps"></div>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ============================================================
   O PESO DA DECISÃO — v2
   Três dilemas universais. Cinco organizações reais. Contextos diferentes.
   Fatos históricos verificados; as alternativas são construções da dinâmica.
   ============================================================ */
const FASES = ["cadastro","perfil","r1","rev1","r2","rev2","r3","rev3","final"];
const ROTULOS = ["Cadastro","Perfil","Dilema 1","Revelação 1","Dilema 2","Revelação 2","Dilema 3","Revelação 3","Linha do tempo"];
const CODIGOS = ["A","B","C","D","E"];
const SENHA_FACILITADOR = "DECIDIR2026";
const FRASE_FINAL = "Uma liderança não é definida pela certeza de suas decisões, mas pela responsabilidade de assumir seus caminhos.";
const ORDEM = [[1,2,0],[2,0,1],[0,2,1]];

/* ---------------- os três dilemas, iguais para todos ---------------- */
const DILEMAS = [
{
 n:1, nome:"A base parou de responder",
 pergunta:"O que sustentava a organização deixou de funcionar. Onde a liderança age primeiro?",
 cenario:[
  "O motor principal do negócio perdeu força. Os números pioraram, a concorrência mudou de forma e a estrutura que funcionou por anos passou a entregar menos com o mesmo esforço.",
  "O time inteiro olha para a liderança esperando uma direção. Há caixa e energia para um movimento sério — não para três ao mesmo tempo. Escolher um caminho significa adiar os outros dois, possivelmente por anos.",
  "Ninguém no mercado já resolveu esse problema desse jeito, nesse contexto. Não existe referência para copiar."
 ],
 guia:[
  "O que exatamente parou de funcionar: o produto, o jeito de produzir, o jeito de vender ou o jeito de decidir?",
  "O que a organização tem hoje que ninguém mais tem?",
  "Quanto tempo a estrutura atual aguenta antes de o problema virar irreversível?"
 ],
 caminhos:[
  {t:"Arrumar a casa por dentro",
   r:"Manter o que a organização vende e para quem vende, e atacar o modo de operar: método, medição, padronização, metas desdobradas e disciplina de custo.",
   up:["Gera dado e controle onde hoje existe intuição","Melhoria replicável em toda a organização","Não exige apostar o caixa em algo novo"],
   dn:["Resultado leva meses de disciplina para aparecer","Não resolve problema de demanda ou de percepção","Choca com a cultura instalada e pode custar talentos"]},

const ORDEM_CASES = [["C","E","A","D","B"],["D","B","E","C","A"],["A","B","C","D","E"]];
const S = {
  fase:0, etapa:"ctx", grupo:null, grupos:[], respostas:{}, todas:[], midia:{},
  escolha:null, admin:false, modoLocal:true, dbOK:false, conectando:true, aviso:""
};
let db=null, userCap=null, assetsCap=null, downloadsCap=null, podeEditar=false;
const LS="pesodecisao.v2";

const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const agora=()=>new Date().toISOString();
const chaveResp=(gid,n)=>gid+"__r"+n;

function salvarLocal(){ try{localStorage.setItem(LS,JSON.stringify({grupo:S.grupo,respostas:S.respostas,fase:S.modoLocal?S.fase:undefined}));}catch(e){} }
function lerLocal(){ try{const d=JSON.parse(localStorage.getItem(LS)||"{}");
  if(d.grupo)S.grupo=d.grupo; if(d.respostas)S.respostas=d.respostas;
  if(S.modoLocal&&typeof d.fase==="number")S.fase=d.fase;}catch(e){} }
let toastT=null;
function toast(msg){ const o=document.querySelector(".toast"); if(o)o.remove();
  const t=el("div","toast",esc(msg)); document.body.appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),4200); }

/* ============================================================ DADOS ======== */
const empresa=()=>S.grupo?EMPRESAS[S.grupo.empresa]:null;

const revelacaoDaFase=f=>f===3?1:f===5?2:f===7?3:0;
function caminhosOrdenados(n){
  const d=DILEMAS[n-1], ord=ORDEM[n-1];
  return ord.map((idx,pos)=>({...d.caminhos[idx], orig:idx, rotulo:"CAMINHO 0"+(pos+1)}));
}
function rotuloDoCaminho(n,idx){ return "CAMINHO 0"+(ORDEM[n-1].indexOf(idx)+1); }

/* ============================================================ BANCO ======== */
async function iniciarBanco(){
  let c=null; try{ c=(window.claude&&window.claude.use)?window.claude:null; }catch(e){}
  if(!c){ cairLocal("Modo local: sem conexão com o servidor."); return; }
  try{ userCap=await c.use("user"); }catch(e){}
  try{ assetsCap=await c.use("assets"); }catch(e){}
  try{ downloadsCap=await c.use("downloads"); }catch(e){}
  try{ podeEditar=userCap?await userCap.canEdit():false; }catch(e){}
  let d=null; try{ d=await c.use("db"); }catch(e){}
  if(!d){ cairLocal("Modo local: o banco de dados não está disponível nesta sessão."); return; }
  db=d; S.dbOK=true; S.modoLocal=false; render();
  const limite=setTimeout(()=>{ if(S.conectando){S.conectando=false;S.aviso="Sincronização lenta. Os dados podem estar desatualizados.";render();} },10000);
  try{
    db.doc("estado/sessao").onSnapshot(s=>{
      clearTimeout(limite); S.conectando=false; S.aviso="";
      const v=s.exists?s.data():null, nova=v&&typeof v.fase==="number"?v.fase:0;
      if(nova!==S.fase){ S.fase=nova; S.etapa="ctx"; S.escolha=null; }
      render();
    }, e=>{ clearTimeout(limite); cairLocal("Modo local: "+(e&&e.code==="revoked"?"acesso encerrado.":"não foi possível sincronizar.")); });
    db.doc("estado/midia").onSnapshot(s=>{ S.midia=s.exists?(s.data()||{}):{}; render(); },()=>{});
    db.collection("grupos").onSnapshot(s=>{
      S.grupos=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>String(a.criadoEm).localeCompare(String(b.criadoEm)));
      render(); },()=>{});
    db.collection("respostas").onSnapshot(s=>{
      S.todas=s.docs.map(x=>({id:x.id,...x.data()}));
      S.todas.forEach(r=>{S.respostas[r.id]=r;}); salvarLocal(); render(); },()=>{});
  }catch(e){ clearTimeout(limite); cairLocal("Modo local: não foi possível abrir o banco."); }
}
function cairLocal(msg){ S.modoLocal=true; S.dbOK=false; S.conectando=false; S.aviso=msg||""; lerLocal(); render(); }
async function gravar(caminho,dados){
  if(!db) return false;
  try{ await db.doc(caminho).set(dados); return true; }
  catch(e){
    if(e&&(e.code==="invalid_argument"||e.code==="revoked")){
      S.modoLocal=true; S.aviso="Sem permissão de escrita no servidor. A sessão seguiu em modo local neste dispositivo.";
      salvarLocal(); render();
    } else toast("Não foi possível salvar agora. Tente novamente.");
    return false;
  }
}

/* ============================================================ AÇÕES ======== */
async function cadastrar(nome,emp,resp){
  const id=(nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"grupo")+"-"+Math.random().toString(36).slice(2,6);
  const g={id,nome:nome.trim(),empresa:emp,responsavel:(resp||"").trim(),criadoEm:agora()};
  S.grupo=g; salvarLocal();
  if(!S.modoLocal){ const ok=await gravar("grupos/"+id,{nome:g.nome,empresa:g.empresa,responsavel:g.responsavel,criadoEm:g.criadoEm}); if(!ok&&!S.modoLocal)return; }
  if(S.modoLocal&&!S.grupos.some(x=>x.id===id)) S.grupos.push(g);
  render();
}
async function enviarResposta(n,cm,estrategia,justificativa){
  const d={grupoId:S.grupo.id,grupoNome:S.grupo.nome,empresa:S.grupo.empresa,rodada:n,
    caminhoRotulo:cm.rotulo,caminhoTitulo:cm.t,caminhoOrig:cm.orig,
    dilema:DILEMAS[n-1].nome,estrategia,justificativa,enviadoEm:agora()};
  S.respostas[chaveResp(S.grupo.id,n)]=d; salvarLocal();
  if(!S.modoLocal) await gravar("respostas/"+chaveResp(S.grupo.id,n),d);
  S.etapa="sent"; render();
}
async function definirFase(f){
  S.fase=f; S.etapa="ctx"; S.escolha=null;
  if(!S.modoLocal) await gravar("estado/sessao",{fase:f,atualizadoEm:agora()}); else salvarLocal();
  render();
}
async function reiniciar(){
  if(!confirm("Reiniciar a dinâmica? Todos os grupos e respostas serão apagados. As imagens enviadas serão mantidas.")) return;
  if(!S.modoLocal&&db){
    try{
      const gs=await db.collection("grupos").get(); for(const x of gs.docs) await db.doc("grupos/"+x.id).delete();
      const rs=await db.collection("respostas").get(); for(const x of rs.docs) await db.doc("respostas/"+x.id).delete();
    }catch(e){ toast("Não foi possível apagar tudo no servidor."); }
  }
  S.grupos=[]; S.todas=[]; S.respostas={}; S.grupo=null;
  try{localStorage.removeItem(LS);}catch(e){}
  await definirFase(0); toast("Dinâmica reiniciada.");
}
async function enviarImagem(chave,file,statusEl){
  if(!assetsCap||!assetsCap.upload){ toast("Envio de imagens indisponível nesta visualização."); return; }
  if(file.size>19*1024*1024){ toast("Arquivo acima de 19 MB."); return; }
  statusEl.textContent="enviando…"; statusEl.className="st";
  try{
    const r=await assetsCap.upload(file);
    const novo={...S.midia}; novo[chave]={url:r.url,id:r.id,em:agora()};
    const ok=await gravar("estado/midia",novo);
    if(ok){ S.midia=novo; statusEl.textContent="enviada"; statusEl.className="st ok"; render(); }
    else statusEl.textContent="falhou";
  }catch(e){ statusEl.textContent="falhou"; toast("Não foi possível enviar a imagem."); }
}

  const s=el("div","steps"), l=el("div","steps-lbl");
  for(let i=0;i<9;i++) s.appendChild(el("div","step"+(i<S.fase?" done":i===S.fase?" now":"")));
  l.appendChild(el("span",null,esc(ROTULOS[S.fase])));
  l.appendChild(el("span",null,"ETAPA "+(S.fase+1)+" / 9"));

function render(){

  else if(revelacaoDaFase(S.fase)) telaRevelacao(v,revelacaoDaFase(S.fase));
  else telaFinal(v);
  app.appendChild(v);
  if(S.aviso) app.appendChild(el("div","card quiet mt24",'<div class="hint" style="color:#E0B45E">'+esc(S.aviso)+"</div>"));
}

function resumir(t,max){ t=String(t||""); return t.length>max?t.slice(0,max-1).replace(/\s+\S*$/,"")+"…":t; }

function gerarImagem(btn){
  const e=empresa(), W=1080, H=1920;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const x=cv.getContext("2d"); if(!x){ toast("Não foi possível gerar a imagem."); return; }
  const g=x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,"#0C1838"); g.addColorStop(.5,"#060C1C"); g.addColorStop(1,"#0B1128");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.save(); x.globalAlpha=.5; x.strokeStyle="#1E2E59"; x.lineWidth=1;
  for(let i=1;i<9;i++){x.beginPath();x.moveTo(i*W/9,0);x.lineTo(i*W/9,H);x.stroke();} x.restore();
  x.fillStyle="rgba(255,200,49,.07)"; x.beginPath(); x.arc(W-60,120,230,0,7); x.fill();
  const F=(w,s)=>w+" "+s+'px Raleway, Arial, Helvetica, sans-serif';
  const M=s=>'500 '+s+'px "IBM Plex Mono", monospace';
  const sp=(v)=>{ try{x.letterSpacing=v;}catch(e){} };
  function wrap(t,X,Y,maxW,lh,lim){
    const ws=String(t).split(/\s+/); let line="",yy=Y,nl=0;
    for(let i=0;i<ws.length;i++){
      const test=line?line+" "+ws[i]:ws[i];
      if(x.measureText(test).width>maxW&&line){
        x.fillText(line,X,yy); yy+=lh; nl++; line=ws[i];
        if(lim&&nl>=lim){ x.fillText(line.slice(0,36)+"…",X,yy); return yy+lh; }
      } else line=test;
    }
    if(line){ x.fillText(line,X,yy); yy+=lh; }
    return yy;
  }
  let y=128;
  x.fillStyle="#FFC831"; x.font=M(24); sp("7px");
  x.fillText("O PESO DA DECISÃO",76,y); sp("0px"); y+=80;
  x.fillStyle="#FFFFFF"; x.font=F(900,72); x.fillText("NOSSA JORNADA",76,y); y+=76;
  x.fillText("DE LIDERANÇA",76,y); y+=54;
  x.fillStyle="#8392B8"; x.font=F(400,28);
  y=wrap("As decisões que tomamos e os caminhos que escolhemos.",76,y,920,38)+22;
  x.fillStyle="#C8D4EE"; x.font=M(23);
  x.fillText("GRUPO "+S.grupo.nome.toUpperCase(),76,y); y+=34;
  x.fillStyle="#FFC831"; x.font=M(23);
  x.fillText("ORGANIZAÇÃO "+e.codigo+"  ·  "+e.real.nome.toUpperCase(),76,y); y+=52;

  for(let n=1;n<=3;n++){
    const d=DILEMAS[n-1], mo=momento(e.codigo,n), ja=minhaResposta(n);
    const topo=y-16;
    x.fillStyle="rgba(255,255,255,.028)";
    rr(x,64,topo,W-128,430,20,true);
    x.strokeStyle="#1B2A52"; x.lineWidth=1.5; rr(x,64,topo,W-128,430,20,false);
    x.fillStyle="#FFC831"; x.beginPath(); x.arc(104,y+22,13,0,7); x.fill();
    const X=142, maxW=854;
    x.fillStyle="#FFC831"; x.font=M(21); sp("3px");
    x.fillText("DILEMA 0"+n,X,y+28); sp("0px"); y+=62;
    x.fillStyle="#FFFFFF"; x.font=F(800,36); y=wrap(d.nome,X,y,maxW,44)+16;
    x.fillStyle="#8392B8"; x.font=M(19); sp("2px");
    x.fillText("NOSSO CAMINHO",X,y); sp("0px"); y+=34;
    x.fillStyle="#FFC831"; x.font=F(700,29);
    y=wrap(ja?ja.caminhoRotulo+" · "+ja.caminhoTitulo:"Sem registro",X,y,maxW,37)+6;
    if(ja){ x.fillStyle="#9FB0D6"; x.font=F(400,23); y=wrap(ja.estrategia,X,y,maxW,31,3)+12; }
    x.fillStyle="#8392B8"; x.font=M(19); sp("2px");
    x.fillText((e.real.nome+" · "+mo.ano).toUpperCase(),X,y); sp("0px"); y+=34;
    x.fillStyle="#6BB6E8"; x.font=F(700,27);
    y=wrap(d.caminhos[mo.caminho].t,X,y,maxW,34)+4;
    x.fillStyle="#7F8FB5"; x.font=F(400,22); y=wrap(mo.rev.titulo,X,y,maxW,30,2);
    y=topo+430+26;
  }
  const qy=Math.max(y+8,H-310);
  x.fillStyle="rgba(255,200,49,.1)"; rr(x,64,qy-54,W-128,236,24,true);
  x.strokeStyle="#8A6A1A"; x.lineWidth=2; rr(x,64,qy-54,W-128,236,24,false);
  x.fillStyle="#FFC831"; x.font=F(800,34);
  wrap("“"+FRASE_FINAL+"”",104,qy+4,W-208,46);
  x.fillStyle="#5E6E96"; x.font=M(20); sp("4px");
  x.fillText("BRASIL JÚNIOR  ·  O PESO DA DECISÃO",76,H-56); sp("0px");

  const pv=document.getElementById("previewTL");
  if(pv){ pv.innerHTML=""; const img=el("img"); img.alt="Linha do tempo do grupo";
    img.style.cssText="width:100%;border-radius:14px;border:1px solid var(--line);display:block";
    img.src=cv.toDataURL("image/png"); pv.appendChild(img);
    pv.appendChild(el("div","hint mt8","Toque e segure na imagem para salvar, ou use o botão de download.")); }
  const nome="linha-do-tempo-"+S.grupo.nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".png";
  cv.toBlob(async b=>{
    if(!b){ toast("Não foi possível gerar a imagem."); return; }
    if(downloadsCap&&downloadsCap.save){
      try{ await downloadsCap.save({filename:nome,data:b}); toast("Linha do tempo salva."); }
      catch(err){ if(err&&err.code!=="declined") toast("Use a imagem abaixo: toque e segure para salvar."); }
    } else toast("Use a imagem abaixo: toque e segure para salvar.");
    if(btn) btn.textContent="GERAR NOVAMENTE";
  },"image/png");
}
function rr(c,X,Y,W2,H2,R,fill){ c.beginPath(); c.moveTo(X+R,Y);
  c.arcTo(X+W2,Y,X+W2,Y+H2,R); c.arcTo(X+W2,Y+H2,X,Y+H2,R); c.arcTo(X,Y+H2,X,Y,R); c.arcTo(X,Y,X+W2,Y,R);
  c.closePath(); if(fill)c.fill(); else c.stroke(); }

/* ============================================================ ADMIN ======== */
let adminLiberado=false;
function telaAdmin(v){
  if(!adminLiberado){
    const c=el("div","card mt32");
    c.innerHTML='<div class="kicker">Área restrita</div><h3 class="mb16" style="font-size:19px">Painel do facilitador</h3>'+
      '<label for="pw">Senha</label><input type="text" id="pw" autocomplete="off" placeholder="Informe a senha do facilitador">';
    const b=el("button","btn mt16","ENTRAR");
    b.onclick=()=>{ if(c.querySelector("#pw").value.trim()===SENHA_FACILITADOR){adminLiberado=true;render();} else toast("Senha incorreta."); };
    c.querySelector("#pw").addEventListener("keydown",ev=>{if(ev.key==="Enter")b.click();});
    c.appendChild(b); v.appendChild(c); return;
  }
  v.appendChild(el("div",null,`<div style="padding:24px 0 4px">
    <div class="kicker">Painel do facilitador</div>
    <h2 class="sec-title">Controle da experiência</h2>
    <p class="lead">Todos os grupos recebem o mesmo dilema ao mesmo tempo. A sequência é obrigatória.</p></div>`));

  const st=el("div","card mt16");
  st.innerHTML='<div class="block-t">Etapa atual</div><h3 style="font-size:22px">'+esc(ROTULOS[S.fase])+"</h3>"+
    '<div class="hint mt8">Etapa '+(S.fase+1)+" de 9 · "+(S.modoLocal?"modo local (controla apenas este dispositivo)":"sincronizado com todos os grupos")+"</div>";
  const nav=el("div","btn-row");
  const prev=el("button","btn ghost","← ETAPA ANTERIOR"); prev.disabled=S.fase===0; prev.onclick=()=>definirFase(S.fase-1);
  const next=el("button","btn",S.fase===0?"INICIAR EXPERIÊNCIA":S.fase===8?"ETAPA FINAL ATINGIDA":"LIBERAR: "+ROTULOS[S.fase+1].toUpperCase());
  next.disabled=S.fase===8; next.onclick=()=>definirFase(S.fase+1);
  nav.appendChild(prev); nav.appendChild(next); st.appendChild(nav);
  const jump=el("div","btn-row");
  ROTULOS.forEach((r,i)=>{ const b=el("button","btn ghost sm",(i+1)+". "+r);
    if(i===S.fase)b.style.borderColor="var(--amber)"; b.onclick=()=>definirFase(i); jump.appendChild(b); });
  st.appendChild(jump); v.appendChild(st);

  const prog=el("div","card mt16");
  prog.innerHTML='<div class="block-t">Grupos e progresso · '+S.grupos.length+"</div>";
  if(!S.grupos.length) prog.appendChild(el("div","empty","Nenhum grupo registrado ainda."));
  S.grupos.forEach(gr=>{
    const r=el("div","rowitem");
    const dots=[1,2,3].map(n=>{
      const ok=S.todas.some(x=>x.grupoId===gr.id&&x.rodada===n)||(S.respostas[chaveResp(gr.id,n)]!=null);
      return '<span class="dot'+(ok?" on":"")+'" title="Dilema '+n+'"></span>';
    }).join("");
    r.innerHTML='<div class="badge">'+esc(gr.empresa)+'</div><div><div class="nm">'+esc(gr.nome)+"</div>"+
      '<div class="sub">'+esc(EMPRESAS[gr.empresa]?EMPRESAS[gr.empresa].real.nome:"")+(gr.responsavel?" · "+esc(gr.responsavel):"")+
      '</div></div><div class="dots">'+dots+"</div>";
    prog.appendChild(r);
  });
  v.appendChild(prog);

  const rodAtual=rodadaDaFase(S.fase)||revelacaoDaFase(S.fase);
  if(rodAtual){
    const resumo=el("div","card quiet mt16");
    const resp=S.todas.filter(x=>x.rodada===rodAtual);
    const cont={};
    resp.forEach(r=>{cont[r.caminhoRotulo]=(cont[r.caminhoRotulo]||0)+1;});
    resumo.innerHTML='<div class="block-t">Dilema 0'+rodAtual+" · "+resp.length+" de "+(S.grupos.length||0)+" grupos responderam</div>"+
      caminhosOrdenados(rodAtual).map(cm=>'<div class="rowitem"><div class="badge">'+(cont[cm.rotulo]||0)+
      '</div><div><div class="nm">'+esc(cm.rotulo)+'</div><div class="sub">'+esc(cm.t)+"</div></div></div>").join("");
    v.appendChild(resumo);
  }

  const tabela=el("div","card mt16");
  tabela.innerHTML='<div class="block-t">Decisões e justificativas · '+S.todas.length+" registros</div>";
  if(!S.todas.length) tabela.appendChild(el("div","empty","Nenhuma resposta registrada ainda."));
  else{
    const sc=el("div","scrollx");
    const rows=S.todas.slice().sort((a,b)=>(a.rodada-b.rodada)||String(a.grupoNome).localeCompare(String(b.grupoNome)));
    sc.innerHTML='<table><thead><tr><th>D</th><th>Grupo</th><th>Org.</th><th>Caminho</th><th>Justificativa</th><th>Estratégia</th></tr></thead><tbody>'+
      rows.map(r=>"<tr><td>0"+r.rodada+"</td><td><b>"+esc(r.grupoNome)+"</b></td><td>"+esc(r.empresa)+"</td><td>"+
        esc(r.caminhoRotulo)+'<div class="mini">'+esc(r.caminhoTitulo)+'</div></td><td><div class="mini">'+esc(r.justificativa)+
        '</div></td><td><div class="mini">'+esc(r.estrategia)+"</div></td></tr>").join("")+"</tbody></table>";
    tabela.appendChild(sc);
    const exp=el("button","btn ghost sm mt16","EXPORTAR RESPOSTAS (CSV)");
    exp.onclick=()=>exportarCSV(rows); tabela.appendChild(exp);
  }
  v.appendChild(tabela);

  /* ---- imagens reais ---- */
  const im=el("div","card mt16");
  im.innerHTML='<div class="block-t">Fotografias e logotipos das organizações</div>'+
    '<div class="hint mb16">Envie uma fotografia por organização e por dilema para dar protagonismo visual à revelação. '+
    'Sem envio, a tela usa uma composição gráfica própria. Formatos: PNG, JPG ou WebP, até 19 MB.</div>';
  if(!assetsCap) im.appendChild(el("div","empty","Envio de imagens indisponível nesta visualização. Abra o artefato como proprietário ou editor."));
  else{
    CODIGOS.forEach(cod=>{
      const bloco=el("div","card quiet mb12");
      bloco.innerHTML='<div class="rowitem" style="padding-top:0"><div class="badge">'+cod+
        '</div><div><div class="nm">'+esc(EMPRESAS[cod].real.nome)+"</div></div></div>";
      [["logo_"+cod,"Logotipo"],[cod+"_1","Foto · Dilema 1"],[cod+"_2","Foto · Dilema 2"],[cod+"_3","Foto · Dilema 3"]]
        .forEach(([chave,rot])=>{
          const linha=el("div","upl");
          const atual=S.midia[chave];
          linha.innerHTML=(atual?'<img class="thumb" src="'+esc(atual.url)+'" alt="">':'<span class="thumb"></span>')+
            '<span class="lbl">'+esc(rot)+"</span>";
          const inp=el("input"); inp.type="file"; inp.accept="image/png,image/jpeg,image/webp";
          const stt=el("span","st"+(atual?" ok":""),atual?"enviada":"sem imagem");
          inp.onchange=()=>{ if(inp.files&&inp.files[0]) enviarImagem(chave,inp.files[0],stt); };
          linha.appendChild(inp); linha.appendChild(stt); bloco.appendChild(linha);
        });
      im.appendChild(bloco);
    });
  }
  v.appendChild(im);

  const gab=el("div","card quiet mt16");
  gab.innerHTML='<div class="block-t">Gabarito — qual caminho cada organização adotou</div>'+
    '<div class="scrollx"><table><thead><tr><th>Organização</th><th>Dilema 1</th><th>Dilema 2</th><th>Dilema 3</th></tr></thead><tbody>'+
    CODIGOS.map(k=>"<tr><td><b>"+k+"</b> "+esc(EMPRESAS[k].real.nome)+"</td>"+
      [1,2,3].map(n=>{const mo=momento(k,n);return "<td>"+rotuloDoCaminho(n,mo.caminho)+'<div class="mini">'+esc(DILEMAS[n-1].caminhos[mo.caminho].t)+"</div></td>";}).join("")+
      "</tr>").join("")+"</tbody></table></div>";
  v.appendChild(gab);

  const dz=el("div","card mt16");
  dz.innerHTML='<div class="block-t">Zona de risco</div><div class="hint mb12">Apaga todos os grupos e respostas e devolve a experiência ao início.</div>';
  const rb=el("button","btn ghost sm","REINICIAR A DINÂMICA");
  rb.style.borderColor="#6A3A33"; rb.style.color="#E08878"; rb.onclick=reiniciar;
  dz.appendChild(rb); v.appendChild(dz);
}
function exportarCSV(rows){
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const csv=["Dilema,NomeDoDilema,Grupo,Organizacao,OrganizacaoReal,Caminho,TituloCaminho,Justificativa,Estrategia,EnviadoEm"]
    .concat(rows.map(r=>[r.rodada,r.dilema,r.grupoNome,r.empresa,(EMPRESAS[r.empresa]||{real:{}}).real.nome,
      r.caminhoRotulo,r.caminhoTitulo,r.justificativa,r.estrategia,r.enviadoEm].map(q).join(","))).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv"});
  if(downloadsCap&&downloadsCap.save){
    downloadsCap.save({filename:"peso-da-decisao-respostas.csv",data:blob})
      .then(()=>toast("CSV salvo.")).catch(e=>{ if(e&&e.code!=="declined") toast("Não foi possível salvar o CSV."); });
  } else toast("Download indisponível nesta visualização.");
}
